name: Sync upstream release (Moonleashed)

# Merges each new upstream Unleashed release into main, rebuilds the BLE Full
# package, and publishes it as a release on this fork. Runs on a daily schedule;
# the "check" job is a cheap no-op when upstream has not released anything new.
#
# Branch layout:
#  - `main` is the fork. It started from upstream `dev`, carries the Moonleashed
#    changes (SD-resident JS, XIP, Sub-GHz and Archive on the SD card, BLE Full
#    raw HCI mode, no update slideshow), and takes each upstream release by
#    merge. History is never rewritten, so nothing here force-pushes main.
#  - `release` is an exact, unmodified mirror of upstream's `release` branch.
#    Its tip is what "have we already synced this release" is judged against.
#    Never add commits to `release`.
#  - `feat/js-sd-mjs` is frozen. It is the branch linked from the declined
#    upstream RFC, DarkFlippers/unleashed-firmware#1144, and is not synced.
#
# What gets merged: each upstream release tip is "Merge branch 'dev' into
# release". When its files are identical to that merged dev commit, this merges
# the dev commit, so main stays on dev's line of history; otherwise, when
# upstream committed on release directly, it merges release itself.
#
# API version: upstream bumps targets/f7/api_symbols.csv every release, so the
# Version line conflicts. The fork's rule is upstream's version with the minor
# number plus one. This workflow applies that rule after every merge and resolves
# a conflict confined to Version lines; any other conflict fails the run with
# nothing pushed.
#
# Token: a merge that brings in upstream edits to .github/workflows is a push
# GitHub refuses from the built-in GITHUB_TOKEN. Upstream edits its workflows in
# most releases. Add a repository secret named SYNC_TOKEN holding a token that
# can push workflow changes: a fine-grained token for this repository with
# Contents and Workflows set to read and write, or a classic token with the repo
# and workflow scopes. Without it, such a push fails with a message saying so.
#
# Other notes:
#  - Nothing here hardcodes this repository's own name (only the upstream URL
#    it syncs from), so renaming the repository does not break it. GitHub
#    already disables scheduled workflows in forks unless enabled by hand, so
#    no `github.repository == ...` guard is needed either.
#  - A failed merge, check or build aborts before anything is pushed. A code
#    conflict needs a manual merge of the same target, then a normal push.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and republish even if already in sync with upstream release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/DarkFlippers/unleashed-firmware.git
  API_CSV: targets/f7/api_symbols.csv

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.compare.outputs.new_release }}
      new_tag: ${{ steps.compare.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release and our mirror of it
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream +refs/heads/release:refs/remotes/upstream/release --tags --quiet
          git fetch origin +refs/heads/release:refs/remotes/origin/release --quiet

      - name: Compare upstream release to our mirror
        id: compare
        run: |
          UPSTREAM_TIP="$(git rev-parse upstream/release)"
          OLD_RELEASE="$(git rev-parse origin/release)"
          NEW_TAG="$(git tag -l 'unlshd-*' --sort=-creatordate --points-at "$UPSTREAM_TIP" | head -1)"
          echo "new_tag=${NEW_TAG:-$UPSTREAM_TIP}" >> "$GITHUB_OUTPUT"
          if [ "$UPSTREAM_TIP" = "$OLD_RELEASE" ] && [ "${{ inputs.force_rebuild }}" != "true" ]; then
            echo "No new upstream release; fork's release mirror already at $UPSTREAM_TIP."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream release to sync: ${NEW_TAG:-$UPSTREAM_TIP} ($UPSTREAM_TIP)"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi

  merge-and-build:
    needs: check
    if: needs.check.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # The pushes below go out with whatever token checkout persists.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream release
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream +refs/heads/release:refs/remotes/upstream/release --tags --quiet
          git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet

      - name: Choose what to merge
        id: target
        run: |
          RELEASE="$(git rev-parse upstream/release)"
          if git rev-parse -q --verify "$RELEASE^2" >/dev/null && git diff --quiet "$RELEASE" "$RELEASE^2"; then
            TARGET="$(git rev-parse "$RELEASE^2")"
            echo "Release tip matches its dev parent; merging dev commit $TARGET."
          else
            TARGET="$RELEASE"
            echo "Release carries changes beyond its dev parent; merging release $TARGET."
          fi
          echo "commit=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Merge the release into main
        env:
          TARGET: ${{ steps.target.outputs.commit }}
          TAG: ${{ needs.check.outputs.new_tag }}
        run: |
          git checkout -B main origin/main

          # The fork's API version: upstream's, with the minor number plus one.
          UPSTREAM_VERSION="$(git show "$TARGET:$API_CSV" | grep -m1 '^Version,' | cut -d, -f3)"
          FORK_VERSION="$(echo "$UPSTREAM_VERSION" | awk -F. '{ printf "%d.%d", $1, $2 + 1 }')"
          echo "Upstream API $UPSTREAM_VERSION, fork API $FORK_VERSION"

          if git merge-base --is-ancestor "$TARGET" main; then
            echo "main already contains $TARGET; nothing to merge."
          elif ! git merge --no-ff --no-edit -m "Merge upstream $TAG into main" "$TARGET"; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ "$CONFLICTS" != "$API_CSV" ]; then
              git merge --abort
              echo "::error::Merging upstream $TAG conflicts beyond the API version line: $(echo $CONFLICTS). Nothing was pushed; merge $TARGET into main by hand."
              exit 1
            fi
            # Resolve conflict blocks that contain nothing but Version lines.
            # Written as an if-condition: steps run under bash -e, so a bare
            # failing command would exit before the merge could be aborted.
            if ! python3 - "$API_CSV" "$FORK_VERSION" <<'PY'
          import sys
          path, version = sys.argv[1], sys.argv[2]
          out, block, in_block = [], [], False
          for line in open(path):
              if line.startswith("<<<<<<< "):
                  in_block, block = True, []
              elif in_block and line.startswith(">>>>>>> "):
                  body = [l for l in block if not l.startswith(("=======", "||||||| "))]
                  if not body or any(not l.startswith("Version,") for l in body):
                      sys.exit("conflict block is not only the Version line")
                  out.append(f"Version,+,{version},,\n")
                  in_block = False
              elif in_block:
                  block.append(line)
              else:
                  out.append(line)
          open(path, "w").writelines(out)
          PY
            then
              git merge --abort
              echo "::error::$API_CSV conflicts in more than the Version line. Nothing was pushed; merge $TARGET into main by hand."
              exit 1
            fi
            git add "$API_CSV"
            git commit --no-edit
          fi

          # Apply the version rule even when the merge itself was clean.
          sed -i "s/^Version,+,[0-9.]*,,/Version,+,$FORK_VERSION,,/" "$API_CSV"
          if ! git diff --quiet -- "$API_CSV"; then
            git add "$API_CSV"
            if git log -1 --format=%P | grep -q ' '; then
              git commit --amend --no-edit
            else
              git commit -m "API: set version to $FORK_VERSION for upstream $TAG"
            fi
          fi

      - name: Check the JS app-local API table still matches api_symbols.csv
        run: python3 scripts/check_js_api_table.py

      - name: Build BLE Full
        env:
          DIST_SUFFIX: ${{ needs.check.outputs.new_tag }}-moonleashed
        run: |
          # Match upstream's own CI scope: only the in-tree Scripts pack, not the
          # separately-maintained prebuilt plugin bundle, so the build is fully
          # reproducible from this repo alone.
          find applications/main/extra_resources/resources/apps/ -mindepth 1 -maxdepth 1 ! -name Scripts -exec rm -rf {} + || true
          ./fbt COMPACT=1 DEBUG=0 DIST_SUFFIX="$DIST_SUFFIX" updater_package \
            COPRO_OB_DATA=scripts/ob_custradio.data \
            COPRO_STACK_BIN=stm32wb5x_BLE_Stack_full_fw.bin \
            COPRO_STACK_TYPE=ble_full

      - name: Check every built app and plugin resolves its imports
        env:
          DIST_SUFFIX: ${{ needs.check.outputs.new_tag }}-moonleashed
        run: |
          # Externalised apps link with imports left undefined; without this,
          # a missing export only shows up on a device.
          ./fbt COMPACT=1 DEBUG=0 DIST_SUFFIX="$DIST_SUFFIX" lint_fap_imports

      - name: Push main and the release mirror
        run: |
          # The build step deleted prebuilt resource packs from the checkout;
          # restore them so nothing but the merge is pushed.
          git checkout -- applications/main/extra_resources 2>/dev/null || true
          if [ "$(git rev-parse main)" != "$(git rev-parse origin/main)" ]; then
            git push origin main || {
              echo "::error::Pushing main was refused. If the message mentions workflow permission, upstream changed .github/workflows in this release: add a SYNC_TOKEN secret that can push workflow changes (see the top of this file). Nothing was pushed."
              exit 1
            }
          fi
          git push origin upstream/release:refs/heads/release

      - name: Publish a GitHub Release with the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check.outputs.new_tag }}-moonleashed"
          # Regular files only: dist/f7-C also holds the unpacked f7-update-*
          # directory, and gh cannot upload a directory as an asset. Its
          # contents ship anyway inside flipper-z-f7-update-*.tgz.
          mapfile -t ASSETS < <(find dist/f7-C -maxdepth 1 -type f | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No build artifacts found in dist/f7-C."
            exit 1
          fi
          printf 'Uploading %s\n' "${ASSETS[@]}"
          # Re-runs (force_rebuild) must not die on an existing release.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target main \
              --title "$TAG" \
              --notes "Moonleashed BLE Full build, with upstream Unleashed ${{ needs.check.outputs.new_tag }} merged in. Flash the update package; it includes the BLE Full radio stack." \
              "${ASSETS[@]}"
          fi
